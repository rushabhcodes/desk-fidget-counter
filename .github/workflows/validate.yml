name: Validate board and firmware
on: [push, pull_request, workflow_dispatch]
jobs:
  circuit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck && bun run test
      - run: bun run check:netlist && bun run check:schematic && bun run check:placement
      - run: bun run build
      - run: bun validation/check-design.mjs && bun run check:shorts
      - uses: actions/upload-artifact@v4
        with:
          name: circuit
          path: dist/index/
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi
      - run: bash scripts/test-firmware.sh
      - run: bash firmware/bootstrap.sh
      - run: python3 validation/check-firmware-image.py
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: firmware/build/
