<text x="70" y="680" font-size="19">2× PHR-8 · 16× SPH-004T-P0.5S · Alpha 2840/7 32AWG PTFE, eight colours</text>
<text x="70" y="715" font-size="18">Numbers refer to board pads and LCD signal labels. Verify continuity; plug-back views can reverse apparent order.</text>
<text x="70" y="770" font-size="24">H2 — Removable JST PH6 programming harness</text>
<text x="95" y="810" font-size="18">1 VTref 3V3</text><text x="550" y="810" font-size="18">→  ST-LINK/V2 20-pin: 1 VAPP (sense)</text>
<text x="95" y="842" font-size="18">2 SWDIO</text><text x="550" y="842" font-size="18">→  7 SWDIO</text>
<text x="95" y="874" font-size="18">3 SWCLK</text><text x="550" y="874" font-size="18">→  9 SWCLK</text>
<text x="95" y="906" font-size="18">4 NRST</text><text x="550" y="906" font-size="18">→  15 NRST</text>
<text x="95" y="938" font-size="18">5 GND</text><text x="550" y="938" font-size="18">→  4 GND</text>
<text x="95" y="970" font-size="18">6 BOOT0</text><text x="550" y="970" font-size="18">→  Empty for SWD; optional recovery jumper to VTref</text>
<text x="70" y="1040" font-size="18">Power target via USB-C. Remove H2 before closing. Use manufacturing/WIRING.md for connector views and crimp details.</text>
