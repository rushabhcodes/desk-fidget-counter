<text x="65" y="755" font-size="20">Match circuit numbers, not apparent left/right in connector-face views. Verify every wire by continuity.</text>
<text x="65" y="795" font-size="20">Free insulation length 44 ± 1 mm between rear housing exits; cable maker adds termination allowances.</text>
<text x="65" y="835" font-size="20">8× SSH-003T-P0.2-H + 8× SPH-004T-P0.5S; TE 55A0111-30-9, 30 AWG, OD 0.61 mm nominal.</text>
<text x="65" y="875" font-size="20">VCC = switched 3.3 V. Colours illustrative; both keyed ends removable. Supplied kit lead unused.</text>
<text x="65" y="915" font-size="20">Order H1 as a crimped harness; nominal seating and dressed bends require prototype fit.</text>
