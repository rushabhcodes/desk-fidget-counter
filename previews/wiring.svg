<text x="65" y="65" font-size="30">PCB E6 / mechanics E11 — H1 keyed crimped display harness</text>
<text x="65" y="105" font-size="20">One replacement cable. JST-SH at J6; JST-PH at the display. No inline joints.</text>
<text x="65" y="165" font-size="22">SHR-08V-S-B / J6 1.0 mm pitch</text>
<text x="930" y="165" font-size="22">PHR-8 / screen 2.0 mm pitch</text>
