<text x="65" y="795" font-size="20">Header grid: 2.54 mm. Odd pins lower, even pins upper; see physical pad coordinates in WIRING.md.</text>
<text x="65" y="835" font-size="20">VCC = switched 3.3V. Check all eight signals by continuity; factory colours may vary.</text>
<text x="65" y="875" font-size="20">Illustrated free paths: 25.6–27.9 mm. Trial-dress with slack before cutting; these are not cut lengths.</text>
<text x="65" y="915" font-size="20">Nominal female housings and sleeve envelopes; verify actual kit fit before final assembly.</text>
